version: 2

seeds:
  - name: ohhsfbdb_team_overrides
    description: >
      Corrections to the identifier that a sheet of ohhsfbdb.net gives its own
      school. The site holds a wrong digit on five sheets, which a join on the
      identifier alone would attach to the wrong school. A row whose team_id is
      empty means the school takes a minted identifier, because joeeitel.com
      never named it.
    config:
      column_types:
        sheet: text
        team_id: text
        reason: text
    columns:
      - name: sheet
        data_tests:
          - not_null
          - unique
