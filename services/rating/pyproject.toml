[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ohfootball-rating"
version = "0.1.0"
description = "Margin ratings and game predictions for ohfootball.io"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
ohfootball-rating = "ohfootball_rating.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
