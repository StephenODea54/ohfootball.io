[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ohfootball-rating"
version = "0.1.0"
description = "Elo ratings and game predictions for ohfootball.io"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

# The tracking server is needed by `run` and `sweep`, which tune the rating on a workstation. It
# is not needed by `publish`, which is what the weekly run calls. Keeping it out of the required
# set halves the number of packages an image needs to install to publish a rating.
[project.optional-dependencies]
tracking = ["mlflow==3.14.0"]

[project.scripts]
ohfootball-rating = "ohfootball_rating.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
