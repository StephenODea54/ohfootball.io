# Serves the pages the build drew.
#
# Nothing here reads a database or calls the API. Every address the site answers is a file, and a
# browser that needs data asks the API directly.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # A redirect built from the host and the port would send a visitor to port 8080, which is
    # reachable only inside the network. The proxy in front holds the name and the port a visitor
    # uses, so a redirect names the path alone.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Every name in this directory carries a hash of what the file holds, so a change to the file
    # changes its name. A browser can keep one of these for as long as it likes.
    #
    # A name that is not found here is a missing asset and not a page. It is answered with a plain
    # 404, because sending the application in place of a script would only fail later.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every page is drawn again by each weekly run, so a browser has to ask whether the copy it
    # holds is still current.
    #
    # A page is a directory holding index.html, because that is what the build writes. An address
    # the build drew no page for is answered with the application and a 404. The application then
    # draws the page in the browser from the API, and a crawler is told the address is not part of
    # the site. A team that did not play the season in progress is reached this way.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        error_page 404 /index.html;
        try_files $uri $uri/index.html =404;
    }
}
