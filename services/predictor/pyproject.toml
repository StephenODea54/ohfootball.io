[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ohfootball-predictor"
version = "0.1.0"
description = "Elo ratings and game predictions for ohfootball.io"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow==3.14.0",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
ohfootball-elo = "ohfootball_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
