version: 2

sources:
  - name: ohfootball_metadata
    description: Metadata describing each scraper execution.
    schema: ohfootball_metadata
    tables:
      - name: scrape_runs
        description: One control record per scraper execution.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [running, succeeded, failed]
          - name: started_at
            data_tests:
              - not_null

  - name: ohfootball_raw
    description: Unmodified records loaded by the Joe Eitel scraper.
    schema: ohfootball_raw
    tables:
      - name: teams
        description: One team record per scrape run, season, and source team.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: scrape_run_id
            data_tests:
              - not_null
          - name: season
            data_tests:
              - not_null
          - name: team_id
            data_tests:
              - not_null
          - name: name
            data_tests:
              - not_null

      - name: games
        description: Games scraped from each source team's schedule.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: scrape_run_id
            data_tests:
              - not_null
          - name: season
            data_tests:
              - not_null
          - name: source_team_id
            data_tests:
              - not_null
          - name: game_date
            data_tests:
              - not_null
          - name: home_away
            description: Raw location code; N is retained for legitimate neutral-site games.
            data_tests:
              - accepted_values:
                  arguments:
                    values: [H, A, N]

      - name: ohhsfbdb_index
        description: The index sheet of ohhsfbdb.net, which is the only page holding full school names.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: scrape_run_id
            data_tests:
              - not_null
          - name: school_name
            data_tests:
              - not_null
          - name: sheet
            data_tests:
              - not_null

      - name: ohhsfbdb_teams
        description: One school per sheet of ohhsfbdb.net.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: scrape_run_id
            data_tests:
              - not_null
          - name: sheet
            data_tests:
              - not_null

      - name: ohhsfbdb_games
        description: One school's view of one game, from its sheet on ohhsfbdb.net.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: scrape_run_id
            data_tests:
              - not_null
          - name: sheet
            data_tests:
              - not_null
          - name: season
            data_tests:
              - not_null
          - name: home_away
            description: H, A, or N. N is a game on neither ground, used for the state tournament.
            data_tests:
              - accepted_values:
                  arguments:
                    values: [H, A, N]

      - name: ohhsfbdb_season_summaries
        description: One row per season of one school, holding its own conference, division, region, and rank.
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: scrape_run_id
            data_tests:
              - not_null
          - name: sheet
            data_tests:
              - not_null
          - name: season
            data_tests:
              - not_null
