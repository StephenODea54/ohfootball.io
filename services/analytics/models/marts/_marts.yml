version: 2

models:
  - name: dim_teams
    description: Type II team dimension tracking changes to the complete business row.
    columns:
      - name: team_version_key
        description: Surrogate UUID for this specific Type II version.
        data_tests:
          - not_null
          - unique
      - name: team_key
        description: Durable UUID for the team within a season, shared by all versions.
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: source_id
        description: Team identifier supplied by the source system.
        data_tests:
          - not_null
      - name: name
        data_tests:
          - not_null
      - name: latitude
        description: >
          Degrees north of the location of the school today, from the school_locations seed. Every
          season of a team number gets the same point, so a school that merged or moved shows its
          location today in its old seasons. Null when the seed has no row for the team.
      - name: longitude
        description: Degrees east of the location of the school today. Null with the latitude.
      - name: valid_from
        description: Inclusive time at which this version was first observed.
        data_tests:
          - not_null
      - name: valid_to
        description: Exclusive time at which the next changed version was observed; null for current.
      - name: is_current
        data_tests:
          - not_null

  - name: dim_dates
    description: Calendar dimension spanning every date between the earliest and latest observed games.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: fct_games
    description: Type II game fact with one canonical matchup per version rather than one row per team schedule.
    columns:
      - name: game_version_key
        description: Surrogate UUID for this specific Type II version.
        data_tests:
          - not_null
          - unique
      - name: game_key
        description: Durable deterministic UUID for season, game date, and the two participating teams.
        data_tests:
          - not_null
      - name: game_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: team_a_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: team_b_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: team_a_result
        description: Result from team A's perspective.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [W, L, T, C, unknown]
      - name: team_b_result
        description: Result from team B's perspective.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [W, L, T, C, unknown]
      - name: is_team_a_home
        description: Whether team A is the home team; false for away and neutral-site games.
        data_tests:
          - not_null
      - name: is_team_b_home
        description: Whether team B is the home team; false for away and neutral-site games.
        data_tests:
          - not_null
      - name: is_playoff_game
        data_tests:
          - not_null
      - name: valid_from
        description: Inclusive time at which this game version was first observed.
        data_tests:
          - not_null
      - name: valid_to
        description: >
          Exclusive end of this version. It is the time of the next changed
          version. It is also the time of a later successful run that read the
          schedule of a team that listed the game, when that schedule no longer
          held the game. It is null for the current version. A game that the
          source dropped or moved to another date has no current version. A
          moved game has a new key at its new date.
      - name: is_current
        data_tests:
          - not_null
