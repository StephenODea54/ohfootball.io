# Ruff lints and formats every Python file of the repository. Ruff reads .gitignore, so it skips
# the ignored directories.
target-version = "py312"
line-length = 100

# The first party packages. The import order rule reads this to put their imports after the
# standard library and the third party packages.
src = [
    "services/rating/src",
    "services/dataset/src",
    "services/recruiting/src",
    "infra/postgres",
]

[lint]
# The default rules, the import order, the upgrades that Python 3.12 allows, the bugbear checks
# and the warnings. E501 stays off, because the formatter wraps what it can, and a line it cannot
# wrap is a string or a comment.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
