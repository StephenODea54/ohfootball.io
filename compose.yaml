services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ohfootball
      POSTGRES_USER: im_batman
      POSTGRES_PASSWORD: shhhhhhhhh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.16
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ohfootball.io
      PGADMIN_DEFAULT_PASSWORD: also_shhhhhhhhh
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball?sslmode=disable
      HTTP_ADDR: :8082
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ELO_HOME_ADVANTAGE: ${ELO_HOME_ADVANTAGE:-30}
      ELO_RATING_SCALE: ${ELO_RATING_SCALE:-400}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/readyz"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  dbt:
    build:
      context: ./analytics
    environment:
      DBT_HOST: ${DBT_HOST:-postgres}
      DBT_PORT: ${DBT_PORT:-5432}
      DBT_USER: ${DBT_USER:-im_batman}
      DBT_PASSWORD: ${DBT_PASSWORD:-shhhhhhhhh}
      DBT_DATABASE: ${DBT_DATABASE:-ohfootball}
      DBT_SCHEMA: ${DBT_SCHEMA:-ohfootball_stg}
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./analytics:/usr/app
    working_dir: /usr/app
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  mlflow:
    build:
      context: .
      dockerfile: services/elo/Dockerfile
    entrypoint: ["mlflow"]
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:*
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    profiles:
      - tools

  # Exports by default. A publication needs a Kaggle account, so it takes the credentials from the
  # environment of the machine running it and never from a value written here.
  dataset:
    build:
      context: .
      dockerfile: services/dataset/Dockerfile
    command: ["export", "--directory", "/export"]
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball
      OHFOOTBALL_MARTS_SCHEMA: ohfootball_marts
      OHFOOTBALL_TIME_ZONE: America/New_York
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      KAGGLE_DATASET: ${KAGGLE_DATASET:-}
    volumes:
      - ./services/dataset/export:/export
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  elo:
    build:
      context: .
      dockerfile: services/elo/Dockerfile
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OHFOOTBALL_MARTS_SCHEMA: ohfootball_marts
      OHFOOTBALL_TIME_ZONE: America/New_York
      GIT_PYTHON_REFRESH: quiet
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data:
  mlflow_data:
