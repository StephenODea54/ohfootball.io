services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ohfootball
      POSTGRES_USER: im_batman
      POSTGRES_PASSWORD: shhhhhhhhh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # Applies every migration that the database does not hold yet, and then stops. The services
  # that read the database wait until it stops with success. The directory is mounted, so a new
  # migration is applied without a new build of the image.
  migrate:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball?sslmode=disable
    volumes:
      - ./infra/postgres:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.16
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ohfootball.io
      PGADMIN_DEFAULT_PASSWORD: also_shhhhhhhhh
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball?sslmode=disable
      HTTP_ADDR: :8082
      # Lets a build of the site skip the contact rule and the rate limits. Set the same value as
      # GRAPHQL_API_KEY in services/frontend/.env. Empty lets no request skip them.
      SITE_BUILD_KEY: ${SITE_BUILD_KEY:-}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/readyz"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  dbt:
    build:
      context: ./services/analytics
    environment:
      DBT_HOST: ${DBT_HOST:-postgres}
      DBT_PORT: ${DBT_PORT:-5432}
      DBT_USER: ${DBT_USER:-im_batman}
      DBT_PASSWORD: ${DBT_PASSWORD:-shhhhhhhhh}
      DBT_DATABASE: ${DBT_DATABASE:-ohfootball}
      DBT_SCHEMA: ${DBT_SCHEMA:-ohfootball_stg}
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./services/analytics:/usr/app
    working_dir: /usr/app
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools

  rating:
    build:
      context: .
      dockerfile: services/rating/Dockerfile
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball
      OHFOOTBALL_MARTS_SCHEMA: ohfootball_marts
      OHFOOTBALL_TIME_ZONE: America/New_York
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools

  # Holds what the weekly run calls. The host runs the same image and starts a target inside it on
  # a schedule. Run one here with: make pipeline ARGS=rate
  pipeline:
    build:
      context: .
      dockerfile: infra/pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@postgres:5432/ohfootball
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: im_batman
      PGPASSWORD: shhhhhhhhh
      PGDATABASE: ohfootball
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: im_batman
      DBT_PASSWORD: shhhhhhhhh
      DBT_DATABASE: ohfootball
      DBT_SCHEMA: ohfootball_stg
      OHFOOTBALL_MARTS_SCHEMA: ohfootball_marts
      OHFOOTBALL_TIME_ZONE: America/New_York
      # The scrape names one season and does not read the calendar, so this is set to the year of
      # the season in progress.
      SCRAPER_SEASON: ${SCRAPER_SEASON:-}
      # A publication needs a Kaggle account or an R2 token, and a request to build the site needs
      # a GitHub token, so all are taken from the environment of the machine running this and
      # never written here.
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      KAGGLE_DATASET: ${KAGGLE_DATASET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SITE_WORKFLOW_TOKEN: ${SITE_WORKFLOW_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data:
