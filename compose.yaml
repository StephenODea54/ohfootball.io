services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ohfootball
      POSTGRES_USER: im_batman
      POSTGRES_PASSWORD: shhhhhhhhh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.16
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ohfootball.io
      PGADMIN_DEFAULT_PASSWORD: also_shhhhhhhhh
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dbt:
    build:
      context: ./analytics
    environment:
      DBT_HOST: ${DBT_HOST:-postgres}
      DBT_PORT: ${DBT_PORT:-5432}
      DBT_USER: ${DBT_USER:-im_batman}
      DBT_PASSWORD: ${DBT_PASSWORD:-shhhhhhhhh}
      DBT_DATABASE: ${DBT_DATABASE:-ohfootball}
      DBT_SCHEMA: ${DBT_SCHEMA:-ohfootball_stg}
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./analytics:/usr/app
    working_dir: /usr/app
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data:
