# Dependabot looks for updates each week and opens one pull request for each group.

version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /services/api
      - /services/scraper
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # Dependabot reads the [project] table of each pyproject.toml. A package with a range gets a pull
  # request only when a release falls outside the range.
  - package-ecosystem: pip
    directories:
      - /services/dataset
      - /services/rating
      - /services/recruiting
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # A major update of a package of the site comes in a pull request of its own.
  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Python images stay on 3.12, because .python-version, CI and ruff name the same version. A
  # move to a new version changes all of them at one time, by hand.
  - package-ecosystem: docker
    directories:
      - /infra/pipeline
      - /infra/postgres
      - /services/analytics
      - /services/api
      - /services/dataset
      - /services/rating
      - /services/scraper
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
