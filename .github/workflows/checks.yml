name: checks

# Runs the same gates the pre-commit hook runs, on every change proposed to main. The hook can be
# skipped and only guards the machine it runs on, so this is what actually holds the line.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/api/go.sum
            services/scraper/go.sum
      - run: make lint-go
      - run: make -C services/api vet
      - run: make -C services/api test
      - run: make -C services/scraper vet
      - run: make -C services/scraper test

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The images build on Python 3.12, and this file names the same version.
          python-version-file: .python-version
      # The versions that the Makefile names for a workstation. pip installs them, because the
      # runner is used one time.
      - run: make tools TOOL_INSTALL="pip install"
      - run: make lint-python
      - run: make lint-sql
      - run: make -C services/elo vet
      - run: make -C services/elo test
      - run: make -C services/dataset vet
      - run: make -C services/dataset test
      # Checks the target that asks GitHub to build the site. A stand-in for GitHub answers over
      # the loopback address, and the check needs no image and no database.
      - run: make pipeline-test
      # Checks the target that makes the build of the site ready for Cloudflare Pages, and the
      # headers Pages sends. It needs no build and no API.
      - run: make site-test
      # Checks the settings of the migrations and the names and text of the migration files.
      - run: make postgres-test

  # The site is drawn ahead of time against the API. Biome and Prettier check the format and the
  # lint rules of the site. astro check checks the types of the Astro pages and of the React
  # components, and Vitest runs the unit tests, so a mistake there is found before the site is
  # built. A build is not run here, because it needs an API to read. site.yml builds the site
  # against the public API before it publishes it.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository root has no package.json. This step reads the pnpm version from the
      # packageManager field of the site instead.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: services/frontend
      - run: pnpm lint
        working-directory: services/frontend
      - run: pnpm typecheck
        working-directory: services/frontend
      - run: pnpm test
        working-directory: services/frontend

  # Builds the image that applies the migrations and runs it two times on an empty database. The
  # first run applies every migration. The second run applies nothing and must still succeed,
  # because the host starts the container again on each deploy.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ohfootball
          POSTGRES_USER: im_batman
          POSTGRES_PASSWORD: shhhhhhhhh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U im_batman -d ohfootball"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://im_batman:shhhhhhhhh@localhost:5432/ohfootball?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/postgres/Dockerfile -t ohfootball/migrate .
      - name: apply every migration
        run: docker run --rm --network host -e DATABASE_URL ohfootball/migrate python migrate.py
      - name: apply again
        run: docker run --rm --network host -e DATABASE_URL ohfootball/migrate python migrate.py
      - name: validate the record
        run: docker run --rm --network host -e DATABASE_URL ohfootball/migrate sustained validate
