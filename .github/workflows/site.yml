name: site

# Builds the site against the public API and publishes it to Cloudflare Pages.
#
# The build draws every page of the current season from the API, so the API must answer on its
# public name while this runs. The weekly run starts this workflow through the REST API of GitHub
# after the new ratings land. See publish-site in infra/pipeline/Makefile. A push to main that
# changes the site starts it too.
#
# A step that fails stops the run before the upload. Pages then keeps the site it served before.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/frontend/**
      - .github/workflows/site.yml

# One run at a time. A run that starts while another runs waits for it and does not stop it, so a
# series of pushes cannot keep the site from being published. GitHub keeps one waiting run, and a
# newer run takes its place. Nothing is lost, because the newer run builds a newer commit and reads
# the API when it runs.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # The upload names main, so a run on any other branch would publish that branch as the site.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Only the build reads the API. No script that a browser loads holds its address, no page
      # except the API page names it, and no file holds its key. make pages checks this.
      GRAPHQL_URL: https://api.ohfootball.io/graphql
      # The build key. It must equal SITE_BUILD_KEY of the API, which then lets the build skip the
      # contact rule and the rate limits. Without it, the build gets 429 and fails.
      GRAPHQL_API_KEY: ${{ secrets.GRAPHQL_API_KEY }}
      ASTRO_TELEMETRY_DISABLED: "1"
      # Shows the Pick column on the team pages. The picks Function, its database and its secret
      # must be in place, or every pick answers that picks are not available.
      PUBLIC_PICKEM: "true"
    steps:
      - uses: actions/checkout@v7
      # The repository root has no package.json. This step reads the pnpm version from the
      # packageManager field of the site instead.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: services/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: services/frontend
      - run: pnpm typecheck
        working-directory: services/frontend
      - run: pnpm build
        working-directory: services/frontend
      # Checks that the build wrote the pages in the form Pages serves, that only /picks/* goes to
      # the Function, that no file except the API page names the API, and that no file holds its
      # key. Then writes the 404 page for assets.
      - run: make pages
        working-directory: services/frontend
      # Bundles the picks Function the way the upload does, so a fault in it stops the run here.
      - run: pnpm exec wrangler pages functions build --outdir .wrangler/functions-check
        working-directory: services/frontend
      # The project has to exist in Pages before the first run. docs/architecture.md tells how to
      # make it. --commit-dirty stops a warning when the checkout holds changes that are not
      # committed. Wrangler runs in services/frontend, because it reads the picks Function from
      # functions/ in the directory it runs in. It bundles the Function and sends it with the files.
      # The action uses the Wrangler that package.json pins and installs no other version.
      - name: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/frontend
          command: >-
            pages deploy dist
            --project-name=ohfootball
            --branch=main
            --commit-dirty=true
