name: migrate

# Applies every migration to the warehouse.
#
# The warehouse sits in an isolated subnet and answers only from inside the network, so this
# workflow never connects to it. It starts a state machine that runs a task inside the network and
# waits for that execution to finish. Nothing outside the network holds a route to the database.
#
# The state machine holds the network the task runs in, the role it runs as, and the timeout it is
# held to, so this workflow names the state machine and nothing else. A task that exits with
# anything but zero fails the execution, so no exit code is read here either.
#
# Every migration is written to be applied again without harm, so the task applies all of them
# every time and keeps no record of what ran.

on:
  # The task pulls the image tagged latest, and deploy.yml is what pushes that tag. Running on the
  # same push as deploy would start the task against the image built before this commit, and the
  # migrations added by this commit would not be applied. So this waits for deploy to finish.
  #
  # That means a migration runs after every deployment rather than only after a change under
  # postgres. Applying all of them again costs one short task and changes nothing, because every
  # migration is written to be repeated.
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Two migrations at once would race on the same tables.
  group: migrate
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    # A deployment that failed has not pushed the image this task pulls.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ohfootball-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: apply the migrations
        env:
          STATE_MACHINE: arn:aws:states:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:stateMachine:ohfootball-migrate
        run: |
          set -euo pipefail

          arn=$(aws stepfunctions start-execution --state-machine-arn "$STATE_MACHINE" \
            --query executionArn --output text)
          echo "started $arn"

          # A standard state machine is watched rather than waited on. There is no wait command for
          # an execution, and the synchronous call is offered only by an express state machine,
          # which cannot run a task and wait for it.
          while true; do
            status=$(aws stepfunctions describe-execution --execution-arn "$arn" \
              --query status --output text)
            if [ "$status" != "RUNNING" ]; then
              break
            fi
            sleep 10
          done

          echo "finished $status"
          if [ "$status" != "SUCCEEDED" ]; then
            echo "the migrations did not apply. The task log holds the statement that failed." >&2
            exit 1
          fi
