name: deploy

# Publishes the code and the stacks. It does not touch the data.
#
# The weekly pipeline collects, rebuilds the marts, rates every team, writes the snapshot, and
# publishes the site. It cannot build the images it runs on, because a task pulls its image before
# it starts, and it cannot build the binary it packs with the snapshot. That is what this does.
#
# Nothing here reaches the warehouse. The warehouse answers only from inside the network, and a
# migration runs through the migrate workflow instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  # Reading the signed token is what lets the job take the deployment role on. No key is stored.
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ARTIFACT_KEY: api/bootstrap

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    strategy:
      # One failed image should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - name: scraper
            dockerfile: services/scraper/Dockerfile
          - name: analytics
            dockerfile: analytics/Dockerfile
          - name: elo
            dockerfile: services/elo/Dockerfile
          - name: snapshot
            dockerfile: services/api/cmd/snapshot/Dockerfile
          - name: site
            dockerfile: frontend/Dockerfile
          - name: migrate
            dockerfile: postgres/Dockerfile
          - name: dataset
            dockerfile: services/dataset/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ohfootball-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # The tasks run on arm64, so the images have to be built for it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/ohfootball/${{ matrix.name }}:latest
            ${{ steps.ecr.outputs.registry }}/ohfootball/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  binary:
    name: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/api/go.sum

      # The runtime starts a binary named bootstrap. The pipeline packs it with the snapshot it
      # writes, so only the binary is published here.
      - run: make -C services/api bootstrap

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ohfootball-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: publish the binary
        run: |
          bucket=$(aws ssm get-parameter --name /ohfootball/artifacts/bucket-name \
            --query Parameter.Value --output text)
          aws s3 cp services/api/bin/bootstrap "s3://${bucket}/${ARTIFACT_KEY}"

  stacks:
    name: stacks
    runs-on: ubuntu-latest
    # The pipeline stack names images that have to exist, and the API stack reads a package the
    # binary is part of, so both are published first.
    needs: [images, binary]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ohfootball-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The pipeline stack reads names the API and the site publish, so it is deployed after both.
      - name: deploy
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          npx cdk deploy --require-approval never \
            OhfootballInfra OhfootballBackend OhfootballFrontend OhfootballEtl
